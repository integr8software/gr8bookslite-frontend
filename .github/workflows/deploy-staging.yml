name: Deploy Frontend Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: gr8booksneo-frontend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    defaults:
      run:
        shell: powershell

    steps:
      - name: Deploy frontend staging
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location "I:\Gr8BooksNeo\apps\frontend"

          git fetch origin staging:refs/remotes/origin/staging
          git reset --hard origin/staging

          pm2 stop gr8booksneo-frontend-staging

          npm ci
          npm run build

          pm2 startOrRestart ecosystem.config.cjs --update-env
          pm2 save
