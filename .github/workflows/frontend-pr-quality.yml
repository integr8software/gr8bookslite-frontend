name: Frontend PR Quality

on:
  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  frontend-pr-quality:
    name: Frontend PR Quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run frontend PR quality analysis
        id: frontend-quality
        uses: integr8software/gr8booksneo-automation/.github/actions/frontend-analysis@develop
        with:
          repository-root: ${{ github.workspace }}
          base-reference: ${{ github.event.pull_request.base.sha }}
          head-reference: ${{ github.event.pull_request.head.sha }}
          maximum-findings-per-rule: "50"
          fail-on-blockers: "true"
          fail-on-warnings: "false"

      - name: Upload frontend QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pr-quality-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  publish-pr-preview:
    name: Publish PR Dashboard Preview
    needs: frontend-pr-quality
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend QA reports
        uses: actions/download-artifact@v4
        with:
          name: frontend-pr-quality-${{ github.run_number }}
          path: ${{ runner.temp }}/frontend-pr-quality

      - name: Verify frontend dashboard PNG
        id: dashboard
        shell: bash
        run: |
          image_path="${RUNNER_TEMP}/frontend-pr-quality/Frontend-QA-Report.png"

          if [[ -f "$image_path" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Frontend dashboard image found: $image_path"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Frontend dashboard image was not generated."
          fi

      - name: Checkout report publishing branch
        if: steps.dashboard.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish frontend dashboard PNG
        if: steps.dashboard.outputs.available == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin qa-reports >/dev/null 2>&1; then
            git fetch origin qa-reports
            git switch --force-create qa-reports origin/qa-reports
          else
            git switch --orphan qa-reports
            git rm -rf . >/dev/null 2>&1 || true
          fi

          report_directory="frontend/pr-${PR_NUMBER}"
          mkdir -p "$report_directory"

          cp \
            "${RUNNER_TEMP}/frontend-pr-quality/Frontend-QA-Report.png" \
            "${report_directory}/Frontend-QA-Report.png"

          git add "${report_directory}/Frontend-QA-Report.png"

          if git diff --cached --quiet; then
            echo "Frontend dashboard image is already current."
          else
            git commit -m "QA: update frontend dashboard for PR #${PR_NUMBER}"
            git push origin qa-reports
          fi

      - name: Create or update frontend QA comment
        if: always()
        uses: actions/github-script@v7
        env:
          DASHBOARD_AVAILABLE: ${{ steps.dashboard.outputs.available }}
          ANALYSIS_RESULT: ${{ needs.frontend-pr-quality.result }}
        with:
          script: |
            const marker = "<!-- gr8books-frontend-pr-quality -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;

            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const passed = process.env.ANALYSIS_RESULT === "success";

            let dashboardSection = `
            > The frontend dashboard image was not generated. Open the workflow run for details.
            `;

            if (process.env.DASHBOARD_AVAILABLE === "true") {
              const imageUrl =
                `${context.serverUrl}/${owner}/${repo}/blob/qa-reports/` +
                `frontend/pr-${issueNumber}/Frontend-QA-Report.png` +
                `?raw=1&run=${context.runId}`;

              dashboardSection = `
            ![Frontend PR Quality Dashboard](${imageUrl})
              `;
            }

            const body = `${marker}
            ## ${passed ? "✅ Ready for Review" : "❌ QA Review Required"}

            ${dashboardSection}

            [Open the complete workflow run](${runUrl})

            _This comment is automatically updated after every push to this PR._
            `;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100
              }
            );

            const existingComment = comments.find(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body
              });
            }